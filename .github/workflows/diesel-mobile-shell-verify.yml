name: Diesel mobile shell verify

on:
  push:
    branches:
      - mobile-shell-refactor
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Diesel app
        run: pnpm --filter @workspace/diesel-mechanic-companion run typecheck

      - name: Build Diesel app
        run: pnpm --filter @workspace/diesel-mechanic-companion run build
